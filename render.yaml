services:
  # Web Service running FastAPI + React (built via Dockerfile)
  - type: web
    name: linkshort
    env: docker
    dockerfilePath: Dockerfile
    startCommand: uvicorn main:app --host 0.0.0.0 --port ${PORT} --proxy-headers --forwarded-allow-ips "*"
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: linkshort-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true

# Managed PostgreSQL Database
databases:
  - name: linkshort-db
    plan: free
