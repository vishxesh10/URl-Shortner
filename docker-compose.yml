version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: linkshort-db
    restart: always
    environment:
      POSTGRES_USER: linkshort_user
      POSTGRES_PASSWORD: linkshort_password
      POSTGRES_DB: linkshort_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkshort_user -d linkshort_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: linkshort-web
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://linkshort_user:linkshort_password@db:5432/linkshort_db
      - JWT_SECRET_KEY=prod-fallback-docker-compose-secret-key-123456789
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
